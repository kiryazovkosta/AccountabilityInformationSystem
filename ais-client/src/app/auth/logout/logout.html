<div class="app-auth-page">
  <div class="app-auth-card">
    <h1 class="app-header-1">Logout</h1>
    @if (logoutResult() === null) {
    <h3 class="app-header-3 text-center">Logging out...</h3>
    } @else if (logoutResult() === true) {
    <h3 class="app-header-3 text-center">You have successfully logged out!</h3>
    } @else {
    <h3 class="app-header-3 text-center">Logout failed. Please try again.</h3>
    }
  </div>
</div>
